#Файл для приема логов с машины работника(назодится на админской машине)

#Включение приёма по UDP и TCP
module(load="imudp")
input(type="imudp" port="514")

module(load="imtcp")
input(type="imtcp" port="514")

#сохранение логов только от работника в отдельный файл
if $fromhost-ip == '192.168.56.20' then {
	action(type="omfile" file="/var/log/remote/worker-audit.log")
	stop
}
