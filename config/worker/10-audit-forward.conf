
#Конфиг для рабочьей машины, читает логи auditd и отправляет их на админскую машину

$ModLoad imfile #Загрузка модуля для чтения локальных файлов
$InputFileName /var/log/audit/audit.log #Файл для чтения
$InputFileTag audit-worker: #Метка для файлов auditd
$InputFileStateFile audit-worker-state #Запись последней строчки
$InputFileSeverity info #Уровень важности сообщения
$InputRunFileMonitor #Команда для запуска слкжки за файлом

*.* @@192.168.56.10:514 #Все логи отправляются по TCP на этот ip(в данном случае админская машина)

